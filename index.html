<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Couples Quest</title>

<meta name="description" content="Quest-Spiel für zwei: Quests erledigen, leveln, Wifey Tokens einlösen.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Couples Quest">
<meta name="theme-color" content="#FBF8F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141220" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap">
<!-- The ?v= must match APP_VERSION in app.js: it busts the CDN cache so a
     deploy cannot leave an old stylesheet or script behind. -->
<link rel="stylesheet" href="styles.css?v=1.6.0">
</head>
<body>

<!-- Build marker — tap-free check that the newest deploy is live -->
<div class="version" id="version"></div>

<!-- Offline / connection notice -->
<div class="banner" id="banner" role="status"></div>

<!-- Toast -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Level up celebration -->
<div class="levelup" id="levelup" role="dialog" aria-modal="true" aria-labelledby="levelupText">
  <div class="levelup__card">
    <div class="levelup__stars" aria-hidden="true">✨🌟✨</div>
    <div class="levelup__text" id="levelupText">Level Up!</div>
    <div class="levelup__level" id="levelupLevel">2</div>
    <button class="levelup__dismiss" data-action="dismiss-levelup">Weiter!</button>
  </div>
</div>

<!-- Chest opening reveal -->
<div class="chestreveal" id="chestReveal" role="dialog" aria-modal="true" aria-labelledby="chestRevealName">
  <div class="chestreveal__card">
    <!-- Filled with the chest artwork by app.js so card and reveal share one source. -->
    <div class="chestreveal__icon" id="chestRevealIcon" aria-hidden="true"></div>
    <div class="chestreveal__title">Truhe geöffnet!</div>
    <div class="chestreveal__name" id="chestRevealName">Küche sauber machen</div>
    <div class="chestreveal__rewards">
      <span class="chestreveal__reward" id="chestRevealExp">+25 EXP</span>
      <span class="chestreveal__reward" id="chestRevealTokens">+5 ◆</span>
    </div>
    <button class="chestreveal__dismiss" data-action="dismiss-chest-reveal">Nice!</button>
  </div>
</div>


<!-- ══ Role picker ══════════════════════════════════════════════════════ -->
<div class="screen role-select" id="screenRole">
  <svg class="role-raccoon" viewBox="0 0 120 120" role="img" aria-label="Waschbär">
    <ellipse cx="60" cy="108" rx="35" ry="6" fill="var(--surface-raised)"/>
    <ellipse cx="60" cy="72" rx="32" ry="28" fill="var(--fur)"/>
    <ellipse cx="60" cy="75" rx="24" ry="20" fill="var(--fur-light)"/>
    <circle cx="60" cy="42" r="24" fill="var(--fur)"/>
    <circle cx="38" cy="22" r="10" fill="var(--fur)"/>
    <circle cx="38" cy="22" r="6" fill="var(--ear)"/>
    <circle cx="82" cy="22" r="10" fill="var(--fur)"/>
    <circle cx="82" cy="22" r="6" fill="var(--ear)"/>
    <ellipse cx="60" cy="40" rx="20" ry="12" fill="var(--mask)"/>
    <ellipse cx="50" cy="39" rx="5" ry="6" fill="#fff"/>
    <ellipse cx="70" cy="39" rx="5" ry="6" fill="#fff"/>
    <circle cx="52" cy="38" r="2.5" fill="#1E1B2E"/>
    <circle cx="72" cy="38" r="2.5" fill="#1E1B2E"/>
    <circle cx="53" cy="37" r="1" fill="#fff"/>
    <circle cx="73" cy="37" r="1" fill="#fff"/>
    <ellipse cx="60" cy="48" rx="3" ry="2" fill="#1E1B2E"/>
    <path d="M56 51 Q60 55 64 51" stroke="#1E1B2E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M88 68 Q105 50 95 35" stroke="var(--fur)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M88 68 Q105 50 95 35" stroke="var(--mask)" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="8 8"/>
  </svg>

  <h1>Couples Quest<span>Wer bist du?</span></h1>

  <div class="role-buttons">
    <button class="role-btn role-btn--player" data-action="pick-role" data-role="player">
      <span class="role-btn__icon" aria-hidden="true">🎮</span>
      <span>
        <span class="role-btn__label">Spieler</span>
        <span class="role-btn__sub">Quests erledigen &amp; leveln</span>
      </span>
    </button>
    <button class="role-btn role-btn--gm" data-action="pick-role" data-role="gm">
      <span class="role-btn__icon" aria-hidden="true">👑</span>
      <span>
        <span class="role-btn__label">Game Master</span>
        <span class="role-btn__sub">Quests erstellen &amp; verwalten</span>
      </span>
    </button>
  </div>
</div>


<!-- ══ Player ═══════════════════════════════════════════════════════════ -->
<div class="screen" id="screenPlayer" hidden>
  <header class="player-header">
    <div class="level-badge">
      <span class="level-badge__lv">Lv</span>
      <span class="level-badge__num" id="playerLevel">1</span>
    </div>

    <div class="stats-col">
      <div class="exp-row">
        <div class="exp-track"><div class="exp-fill" id="expFill" style="width:0%"></div></div>
        <span class="exp-text" id="expText">0 / 100</span>
      </div>
      <div class="token-display">
        <span class="token-icon" aria-hidden="true">◆</span>
        <span class="token-count" id="playerTokens">0</span>
        <span class="token-label">Wifey Tokens</span>
      </div>
    </div>

    <button class="icon-btn" data-action="switch-role" title="Rolle wechseln" aria-label="Rolle wechseln">↺</button>
  </header>

  <!-- Raccoon -->
  <section class="view is-active" id="viewRaccoon">
    <div class="raccoon-stage">
      <!-- Confirmed quests wait here as chests until the player opens them. -->
      <div class="chest-tray" id="chestTray" hidden></div>

      <div class="raccoon-container">
        <svg class="raccoon-svg" viewBox="0 0 200 200" role="img" aria-label="Dein Waschbär">
          <ellipse cx="100" cy="182" rx="48" ry="7" fill="var(--surface-raised)"/>

          <!-- ringed tail, behind the body -->
          <path d="M138 148 Q182 138 176 96" stroke="var(--fur)" stroke-width="22"
                fill="none" stroke-linecap="round"/>
          <path d="M138 148 Q182 138 176 96" stroke="var(--mask)" stroke-width="22"
                fill="none" stroke-linecap="round" stroke-dasharray="13 15"/>

          <!-- body -->
          <ellipse cx="100" cy="138" rx="42" ry="36" fill="var(--fur)"/>
          <ellipse cx="100" cy="144" rx="29" ry="26" fill="var(--fur-light)"/>
          <ellipse cx="62" cy="132" rx="10" ry="17" fill="var(--fur)" transform="rotate(-18 62 132)"/>
          <ellipse cx="138" cy="132" rx="10" ry="17" fill="var(--fur)" transform="rotate(18 138 132)"/>
          <ellipse cx="84" cy="169" rx="13" ry="7" fill="var(--fur-dark)"/>
          <ellipse cx="116" cy="169" rx="13" ry="7" fill="var(--fur-dark)"/>

          <!-- ears -->
          <circle cx="70" cy="48" r="15" fill="var(--fur)"/>
          <circle cx="70" cy="49" r="8.5" fill="var(--ear)"/>
          <circle cx="130" cy="48" r="15" fill="var(--fur)"/>
          <circle cx="130" cy="49" r="8.5" fill="var(--ear)"/>

          <!-- head -->
          <circle cx="100" cy="76" r="37" fill="var(--fur)"/>

          <!-- bandit mask: one dark band, split by a pale blaze down the forehead -->
          <path d="M100 46
                   C 74 46, 63 60, 63 74
                   C 63 88, 76 96, 88 94
                   C 96 92, 96 84, 100 84
                   C 104 84, 104 92, 112 94
                   C 124 96, 137 88, 137 74
                   C 137 60, 126 46, 100 46 Z" fill="var(--mask)"/>
          <path d="M100 44 Q94 60 96 82 L104 82 Q106 60 100 44 Z" fill="var(--fur-light)"/>

          <!-- brow spots above the mask -->
          <ellipse cx="82" cy="54" rx="8" ry="5" fill="var(--fur-light)" opacity="0.85"/>
          <ellipse cx="118" cy="54" rx="8" ry="5" fill="var(--fur-light)" opacity="0.85"/>

          <!-- eyes -->
          <ellipse cx="84" cy="72" rx="8" ry="9" fill="#fff"/>
          <ellipse cx="116" cy="72" rx="8" ry="9" fill="#fff"/>
          <circle cx="86" cy="71" r="4" fill="#1E1B2E"/>
          <circle cx="118" cy="71" r="4" fill="#1E1B2E"/>
          <circle cx="87.6" cy="69.2" r="1.7" fill="#fff"/>
          <circle cx="119.6" cy="69.2" r="1.7" fill="#fff"/>

          <!-- muzzle -->
          <ellipse cx="100" cy="97" rx="18" ry="13" fill="var(--fur-light)"/>
          <ellipse cx="100" cy="91" rx="4.5" ry="3.4" fill="#1E1B2E"/>
          <path d="M100 94 V99" stroke="#1E1B2E" stroke-width="2" stroke-linecap="round"/>
          <path d="M92 101 Q100 107 108 101" stroke="#1E1B2E" stroke-width="2"
                fill="none" stroke-linecap="round"/>

          <!-- blush -->
          <ellipse cx="74" cy="90" rx="6" ry="3.5" fill="var(--ear)" opacity="0.45"/>
          <ellipse cx="126" cy="90" rx="6" ry="3.5" fill="var(--ear)" opacity="0.45"/>
        </svg>
        <div class="raccoon-mood" id="raccoonMood" aria-hidden="true">😴</div>
      </div>
      <p class="raccoon-status" id="raccoonStatus">Alles ruhig gerade.</p>
    </div>
  </section>

  <section class="view" id="viewQuests"><div class="panel" id="playerQuestList"></div></section>
  <section class="view" id="viewShop"><div class="panel" id="playerShopList"></div></section>
  <section class="view" id="viewRewards"><div class="panel" id="playerHistoryList"></div></section>

  <nav class="bottom-nav">
    <button class="nav-btn is-active" data-action="player-tab" data-view="viewRaccoon">
      <span class="nav-btn__icon" aria-hidden="true">🦝</span>
      <span class="nav-btn__label">Raccoon</span>
    </button>
    <button class="nav-btn" data-action="player-tab" data-view="viewQuests">
      <span class="nav-btn__icon" aria-hidden="true">⚔️</span>
      <span class="nav-btn__label">Quests</span>
    </button>
    <button class="nav-btn" data-action="player-tab" data-view="viewShop">
      <span class="nav-btn__icon" aria-hidden="true">🛍️</span>
      <span class="nav-btn__label">Shop</span>
    </button>
    <button class="nav-btn" data-action="player-tab" data-view="viewRewards">
      <span class="nav-btn__icon" aria-hidden="true">🏆</span>
      <span class="nav-btn__label">Verlauf</span>
    </button>
  </nav>
</div>


<!-- ══ Game master ══════════════════════════════════════════════════════ -->
<div class="screen" id="screenGm" hidden>
  <header class="gm-header">
    <div class="gm-header__top">
      <h1 class="gm-header__title">👑 <em>Quest</em>Book</h1>
      <button class="icon-btn" data-action="switch-role" title="Rolle wechseln" aria-label="Rolle wechseln">↺</button>
    </div>
    <div class="stat-row">
      <div class="stat">
        <div class="stat__value stat__value--honey" id="gmLevel">1</div>
        <div class="stat__label">Level</div>
      </div>
      <div class="stat">
        <div class="stat__value stat__value--plum" id="gmTokens">0</div>
        <div class="stat__label">Tokens</div>
      </div>
      <div class="stat">
        <div class="stat__value stat__value--mint" id="gmOpen">0</div>
        <div class="stat__label">Offen</div>
      </div>
    </div>
  </header>

  <div class="gm-body">
    <div class="tabs" role="tablist">
      <button class="tab is-active" data-action="gm-tab" data-tab="quests" role="tab">Quests</button>
      <button class="tab" data-action="gm-tab" data-tab="shop" role="tab">Shop</button>
      <button class="tab" data-action="gm-tab" data-tab="history" role="tab">Verlauf</button>
    </div>
    <div class="tab-panel" id="gmQuestsPanel" role="tabpanel"></div>
    <div class="tab-panel" id="gmShopPanel" role="tabpanel" hidden></div>
    <div class="tab-panel" id="gmHistoryPanel" role="tabpanel" hidden></div>
  </div>

  <button class="fab" id="fab" data-action="open-create" aria-label="Neu erstellen">+</button>
</div>


<!-- ══ Quest form ═══════════════════════════════════════════════════════ -->
<div class="modal" id="questModal" role="dialog" aria-modal="true" aria-labelledby="questModalTitle">
  <form class="sheet" id="questForm">
    <div class="sheet__handle"></div>
    <h2 class="sheet__title" id="questModalTitle">Neue Quest</h2>

    <div class="field">
      <span class="field__label">Kategorie</span>
      <div class="tier-picker" id="tierPicker">
        <button type="button" class="tier-option is-selected" data-action="pick-tier" data-cat="basic">
          <span class="tier-option__icon" aria-hidden="true">🪵</span>
          <span class="tier-option__label">Basic</span>
        </button>
        <button type="button" class="tier-option" data-action="pick-tier" data-cat="rapid_fire">
          <span class="tier-option__icon" aria-hidden="true">🔥</span>
          <span class="tier-option__label">Rapid Fire</span>
        </button>
        <button type="button" class="tier-option" data-action="pick-tier" data-cat="special">
          <span class="tier-option__icon" aria-hidden="true">💎</span>
          <span class="tier-option__label">Special</span>
        </button>
        <button type="button" class="tier-option" data-action="pick-tier" data-cat="divine">
          <span class="tier-option__icon" aria-hidden="true">⭐</span>
          <span class="tier-option__label">Divine</span>
        </button>
      </div>
      <p class="field__hint" id="tierHint"></p>
    </div>

    <div class="field">
      <label class="field__label" for="questName">Quest Name</label>
      <input class="field__input" id="questName" name="name" placeholder="z.B. Küche sauber machen"
             maxlength="80" required autocomplete="off">
    </div>

    <div class="field">
      <label class="field__label" for="questDesc">Beschreibung (optional)</label>
      <input class="field__input" id="questDesc" name="description" placeholder="Details zur Quest…"
             maxlength="200" autocomplete="off">
    </div>

    <div class="field-row">
      <div class="field">
        <label class="field__label" for="questExp">⚡ EXP</label>
        <input class="field__input" id="questExp" name="exp" type="number"
               min="0" max="9999" step="1" value="25" inputmode="numeric" required>
      </div>
      <div class="field">
        <label class="field__label" for="questTokens">◆ Tokens</label>
        <input class="field__input" id="questTokens" name="tokens" type="number"
               min="0" max="9999" step="1" value="5" inputmode="numeric" required>
      </div>
    </div>

    <button class="submit-btn submit-btn--rose" type="submit" id="questSubmit">Quest erstellen</button>
  </form>
</div>


<!-- ══ Shop item form ═══════════════════════════════════════════════════ -->
<div class="modal" id="shopModal" role="dialog" aria-modal="true" aria-labelledby="shopModalTitle">
  <form class="sheet" id="shopForm">
    <div class="sheet__handle"></div>
    <h2 class="sheet__title" id="shopModalTitle">Neuer Shop-Artikel</h2>

    <div class="field">
      <label class="field__label" for="itemName">Artikelname</label>
      <input class="field__input" id="itemName" name="name" placeholder="z.B. Massage"
             maxlength="60" required autocomplete="off">
    </div>

    <div class="field">
      <label class="field__label" for="itemDesc">Beschreibung (optional)</label>
      <input class="field__input" id="itemDesc" name="description" placeholder="Was bekommt der Spieler?"
             maxlength="200" autocomplete="off">
    </div>

    <div class="field-row">
      <div class="field">
        <label class="field__label" for="itemIcon">Icon</label>
        <input class="field__input" id="itemIcon" name="icon" value="🎁" maxlength="4" autocomplete="off">
      </div>
      <!-- 0 is allowed: a giveaway the player can just claim. -->
      <div class="field">
        <label class="field__label" for="itemPrice">◆ Preis</label>
        <input class="field__input" id="itemPrice" name="price" type="number"
               min="0" max="9999" step="1" value="10" inputmode="numeric" required>
      </div>
    </div>

    <button class="submit-btn submit-btn--plum" type="submit" id="shopSubmit">Artikel erstellen</button>
  </form>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=1.6.0"></script>
</body>
</html>
